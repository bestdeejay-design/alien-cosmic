<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="titleAktan">
  <title id="titleAktan">Актан-4 — красная планета Гелиоса</title>
  <defs>
    <radialGradient id="gAktan" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#f6c7a6"/>
      <stop offset="18%" stop-color="#c66a3e"/>
      <stop offset="42%" stop-color="#8a3b28"/>
      <stop offset="68%" stop-color="#5a2016"/>
      <stop offset="100%" stop-color="#2e1010"/>
    </radialGradient>
    <radialGradient id="haloAktan" cx="50%" cy="50%" r="52%">
      <stop offset="62%" stop-color="#76e3d7" stop-opacity="0"/>
      <stop offset="84%" stop-color="#76e3d7" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#76e3d7" stop-opacity=".18"/>
    </radialGradient>
    <filter id="glowAktan"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <!-- faint starfield -->
  <g fill="#c5fff1" opacity=".6">
    <circle cx="32" cy="44" r="1.1"/><circle cx="89" cy="21" r=".9"/><circle cx="312" cy="58" r="1.0"/><circle cx="366" cy="32" r="1.3"/>
    <circle cx="22" cy="398" r=".9"/><circle cx="354" cy="422" r="1.0"/><circle cx="378" cy="188" r=".8"/>
  </g>
  <!-- outer orbital ring -->
  <ellipse cx="200" cy="240" rx="162" ry="162" fill="none" stroke="#e9f8f2" stroke-opacity=".86" stroke-width="1.1" />
  <!-- inner glow halo -->
  <circle cx="200" cy="240" r="172" fill="url(#haloAktan)"/>
  <!-- planet body -->
  <circle cx="200" cy="240" r="92" fill="url(#gAktan)" stroke="#c5fff1" stroke-opacity=".18" stroke-width="1"/>
  <!-- terrain hints - canyon -->
  <g clip-path="url(#clipAktan)" opacity=".9">
    <path d="M128 210c22-8 42-11 62-8 14 6 26 16 33 28l-18 14-28-4-20-16-22 3-12-11z" fill="#4a1d14" fill-opacity=".42"/>
    <path d="M138 258c38-14 66-18 92-9 22 7 36 19 42 33l-10 18-26 8-22 14-18-6-10-16-20-8-14-22 8-18z" fill="#7a3322" fill-opacity=".55"/>
    <path d="M166 188c-8 26-10 46-6 64" stroke="#f3c579" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="3 6"/>
    <circle cx="168" cy="212" r="2.8" fill="#f3c579"/><circle cx="168" cy="212" r="10" fill="none" stroke="#f3c579" stroke-opacity=".45"/>
  </g>
  <clipPath id="clipAktan"><circle cx="200" cy="240" r="92"/></clipPath>
  <circle cx="200" cy="240" r="92" fill="none" stroke="#c5fff1" stroke-opacity=".14" stroke-width=".8"/>
  <!-- diamond markers at 4 cardinals -->
  <g stroke="#e9f8f2" fill="none">
    <g transform="translate(200,78)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" stroke-width="1" fill="#0d2028" fill-opacity=".9" stroke="#e9f8f2"/><circle cx="0" cy="0" r="1.8" fill="#e9f8f2"/></g>
    <g transform="translate(362,240)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" stroke-width="1" fill="#0d2028" fill-opacity=".9" stroke="#e9f8f2"/><circle cx="0" cy="0" r="1.8" fill="#e9f8f2"/></g>
    <g transform="translate(200,402)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" stroke-width="1" fill="#0d2028" fill-opacity=".9" stroke="#e9f8f2"/><circle cx="0" cy="0" r="1.8" fill="#e9f8f2"/></g>
    <g transform="translate(38,240)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" stroke-width="1" fill="#0d2028" fill-opacity=".9" stroke="#e9f8f2"/><circle cx="0" cy="0" r="1.8" fill="#e9f8f2"/></g>
  </g>
  <!-- labels around ring -->
  <g font-family="Inter,system-ui,sans-serif" font-size="6.5" font-weight="750" letter-spacing=".14em" fill="#e9f8f2" text-anchor="middle">
    <text x="200" y="66">ECCENTRICITY</text><text x="200" y="74" font-size="6" font-weight="600" letter-spacing=".08em" fill="#91adae">0.088</text>
    <text x="340" y="222">MASS</text><text x="340" y="230" font-size="6" font-weight="600" letter-spacing=".08em" fill="#91adae">0.42 OF EARTH'S</text>
    <text x="200" y="432">SURFACE GRAVITY</text><text x="200" y="440" font-size="6" font-weight="600" fill="#91adae">0.71 G</text>
    <text x="62" y="222">SURFACE AREA</text><text x="62" y="230" font-size="6" font-weight="600" fill="#91adae">0.52 OF EARTH'S</text>
  </g>
  <text x="200" y="98" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="900" letter-spacing=".42em" fill="#e9f8f2">A K T A N — 4</text>
  <!-- bottom section: aphelion / perihelion + orbit diagram -->
  <line x1="120" y1="470" x2="280" y2="470" stroke="#e9f8f2" stroke-opacity=".85" stroke-width=".9"/>
  <g transform="translate(200,470)"><rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#f3c579" stroke="#0d2028" stroke-width="1"/><text x="0" y="1.2" text-anchor="middle" font-size="9" fill="#0d2028">♂</text></g>
  <g font-family="Inter,sans-serif" text-anchor="middle">
    <rect x="92" y="482" width="92" height="18" rx="2" fill="none" stroke="#e9f8f2" stroke-opacity=".55"/>
    <rect x="216" y="482" width="92" height="18" rx="2" fill="none" stroke="#e9f8f2" stroke-opacity=".55"/>
    <g transform="translate(138,475)"><rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#0d2028" stroke="#e9f8f2"/><circle cx="0" cy="0" r="1.2" fill="#e9f8f2"/></g>
    <g transform="translate(262,475)"><rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#0d2028" stroke="#e9f8f2"/><circle cx="0" cy="0" r="1.2" fill="#e9f8f2"/></g>
    <text x="138" y="494" font-size="6.2" font-weight="700" letter-spacing=".08em" fill="#e9f8f2">1.82 AU</text>
    <text x="262" y="494" font-size="6.2" font-weight="700" letter-spacing=".08em" fill="#e9f8f2">1.44 AU</text>
    <text x="138" y="510" font-size="5.5" font-weight="700" letter-spacing=".16em" fill="#91adae">APHELION</text>
    <text x="262" y="510" font-size="5.5" font-weight="700" letter-spacing=".16em" fill="#91adae">PERIHELION</text>
  </g>
</svg>

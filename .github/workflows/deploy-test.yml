name: deploy-test
on:
  push:
    branches: [test]

permissions:
  contents: write
  actions: write

jobs:
  publish-test-stand:
    # Тестовый стенд = снапшот ветки test в каталоге /test/ продового Pages.
    # Прод-движок (корень сайта) этим не затрагивается; отдельная папка — та же
    # изоляция, что у полигона r/. Источник: спека ace/03-spec, раздел B.2.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Обновить test/ снапшотом ветки test
        run: |
          git fetch origin test
          rm -rf test && mkdir test
          git archive origin/test | tar -x -C test
          # служебное в снапшот не нужно
          rm -rf test/.git test/.github test/backups test/tool-results
          find test -name '.DS_Store' -delete
          if git status --porcelain test | grep -q .; then
            git config user.name "alien-cosmic-ci"
            git config user.email "actions@users.noreply.github.com"
            git add test
            git commit -m "ci: тестовый стенд из test @ ${GITHUB_SHA::7} [skip ci]"
            git push origin main
          else
            echo "Снапшот не изменился"
          fi
      - name: Опубликовать (корень прода не меняется, обновляется только test/)
        run: gh workflow run deploy-prod.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

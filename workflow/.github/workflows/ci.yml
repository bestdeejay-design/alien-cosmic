name: CI — Preflight & Regression

on:
  pull_request:
  push:
    branches:
      - main
      - "arena/**"
      - "work/**"
      - "coord/**"

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight + Behavioral Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Run full preflight and test suite
        run: python3 scripts/preflight --ci-main
